function box(

  mat,
  x,y,z
){

    new THREE.BoxGeometry(

    mat
  );

  m.position.set(
    x,y,z
  );

  m.castShadow=true;
  m.receiveShadow=true;

  scene.add(m);

  return m;
}

// ======================================================
// VEHICLES
// ======================================================

function vehicle(
  x,z,
  color,
  rotation=0,
  scale=1
){

  const g=
  new THREE.Group();

  const body=
  new THREE.Mesh(
    new THREE.BoxGeometry(
      3.8*scale,
      1.25*scale,
      6.4*scale
    ),
    material(color)
  );

  body.position.y=
    1.05*scale;

  body.castShadow=true;

  g.add(body);


  const cabin=
  new THREE.Mesh(
    new THREE.BoxGeometry(
      3.1*scale,
      1.05*scale,
      3.2*scale
    ),
    material(0x526b78)
  );

  cabin.position.y=
    2.05*scale;

  cabin.position.z=
    -.2*scale;

  cabin.castShadow=true;

  g.add(cabin);


  // wheels
  for(
    const sx of [-1,1]
  ){

    for(
      const sz of [-2.1,2.1]
    ){

      const wheel=
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .55*scale,
          .55*scale,
          .3*scale,
          10
        ),
        darkMat
      );

      wheel.rotation.z=
        Math.PI/2;

      wheel.position.set(
        sx*1.9*scale,
        .55*scale,
        sz*scale
      );

      g.add(wheel);

    }

  }


  g.position.set(
    x,
    0,
    z
  );

  g.rotation.y=
    rotation;

  scene.add(g);

  return g;

}

// ======================================================
// PEOPLE
// ======================================================

function person(
  x,z,
  shirt,
  pants,
  scale=.9
){

  const g=
  new THREE.Group();


  const body=
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .25*scale,
      .32*scale,
      1.05*scale,
      7
    ),
    material(shirt)
  );

  body.position.y=
    1.05*scale;

  g.add(body);


  const head=
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .27*scale,
      8,
      8
    ),
    material(0x70452c)
  );

  head.position.y=
    1.75*scale;

  g.add(head);


  const leg1=
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .18*scale,
      .7*scale,
      .18*scale
    ),
    material(pants)
  );

  leg1.position.set(
    -.12*scale,
    .35*scale,
    0
  );

  g.add(leg1);


  const leg2=
  leg1.clone();

  leg2.position.x=
    .12*scale;

  g.add(leg2);


  g.position.set(
    x,
    0,
    z
  );

  scene.add(g);

  return g;

}

        -105+Math.random()*20,
        shirtColors[i%shirtColors.length],
        0x333333,
        .8
      ),
    speed:.5+Math.random(),
    direction:i%2?1:-1
  });

}


// ======================================================
// PLAYER
// ======================================================

const player=
new THREE.Group();

const playerBody=
new THREE.Mesh(
  new THREE.CapsuleGeometry(
    .55,
    1.2,
    6,
    10
  ),
  material(0x23539c)
);

playerBody.position.y=1.25;
playerBody.castShadow=true;

player.add(playerBody);


const playerHead=
new THREE.Mesh(
  new THREE.SphereGeometry(
    .43,
    12,

  ),

);

// ======================================================
// JOYSTICK
// ======================================================

const joystick=
document.getElementById(
  "joystick"
);

const stick=
document.getElementById(
  "stick"
);

let joyX=0;
let joyY=0;
let touching=false;


function joystickMove(
  x,y
){

  const r=
  joystick.getBoundingClientRect();

  let dx=
    x-(r.left+r.width/2);

  let dy=
    y-(r.top+r.height/2);

  const max=42;

  const dist=
    Math.sqrt(dx*dx+dy*dy);

  if(dist>max){

    dx=dx/dist*max;
    dy=dy/dist*max;

  }

  joyX=dx/max;
  joyY=dy/max;

  stick.style.transform=
    `translate(${dx}px,${dy}px)`;

}


function joystickReset(){

  joyX=0;
  joyY=0;

  stick.style.transform=
    "translate(0,0)";

  touching=false;

}


joystick.addEventListener(
  "pointerdown",
  e=>{

    touching=true;

    joystick.setPointerCapture(
      e.pointerId
    );

    joystickMove(
      e.clientX,
      e.clientY
    );

  }
);


joystick.addEventListener(
  "pointermove",
  e=>{

    if(touching)
      joystickMove(
        e.clientX,
        e.clientY
      );

  }
);


joystick.addEventListener(
  "pointerup",
  joystickReset
);

joystick.addEventListener(
  "pointercancel",
  joystickReset
);


// ======================================================
// PLAYER HEIGHT
// ======================================================

let onFlyover=false;


function firstFlyoverHeight(z){

  if(
    z>=-85 &&
    z<-55
  ){

    return(
      ((z+85)/30)*8
    );

  }

  if(
    z>=-55 &&
    z<=55
  ){

    return 8;

  }

  if(
    z>55 &&
    z<=85
  ){

    return(
      ((85-z)/30)*8
    );

  }

  return 0;

}


function secondFlyoverHeight(
  x,z
){

  // second flyover crosses the
  // Challenge/Police direction

  if(
    Math.abs(z+120)<7
  ){

    if(
      x>=45 &&
      x<90
    ){

      return(
        ((x-45)/45)*7
      );

    }

    if(
      x>=90 &&
      x<=165
    ){

      return 7;

    }

    if(
      x>165 &&
      x<=210
    ){

      return(
        ((210-x)/45)*7
      );

    }

  }

  return 0;

}


// ======================================================
// PLAYER MOVEMENT
// ======================================================

const clock=
new THREE.Clock();

let walkTime=0;


function movePlayer(dt){

  const turnSpeed=
    2.45*dt;

  const speed=
    15*dt;


  player.rotation.y -=
    joyX*turnSpeed;


  const forward=
    -joyY;


  if(
    Math.abs(forward)>.05
  ){

    const dir=
    new THREE.Vector3(
      0,
      0,
      forward
    );

    dir.applyAxisAngle(
      new THREE.Vector3(0,1,0),
      player.rotation.y
    );

    player.position.addScaledVector(
      dir,
      speed
    );

    walkTime+=dt*10;

  }


  const x=
    player.position.x;

  const z=
    player.position.z;


  // First flyover
  if(
    Math.abs(x)<7 &&
    z>-87 &&
    z<87
  ){

    // Only climb if the player
    // approaches a ramp.
    if(
      z<-55 ||
      z>55 ||
      onFlyover
    ){

      onFlyover=true;

    }

  }


  if(onFlyover){

    player.position.x=
      THREE.MathUtils.clamp(
        player.position.x,
        -6.3,
        6.3
      );

    player.position.y=
      firstFlyoverHeight(
        player.position.z
      );

    if(
      player.position.z<-89 ||
      player.position.z>89
    ){

      onFlyover=false;
      player.position.y=0;

    }

  }else{

    // second flyover
    const h2=
      secondFlyoverHeight(
        player.position.x,
        player.position.z
      );

    if(
      h2>0 &&
      Math.abs(
        player.position.z+120
      )<7
    ){

      player.position.y=h2;

    }else{

      player.position.y=0;

    }

  }


  player.position.x=
    THREE.MathUtils.clamp(
      player.position.x,
      -145,
      250
    );

  player.position.z=
    THREE.MathUtils.clamp(
      player.position.z,
      -230,
      230
    );


  if(
    Math.abs(forward)>.05
  ){

    playerBody.position.y=
      1.25+
      Math.sin(walkTime)*.04;

  }else{

    playerBody.position.y=1.25;

  }

}


// ======================================================
// TRAFFIC MOVEMENT
// ======================================================

function updateTraffic(dt){

  for(
    const t of trafficCars
  ){

    t.object.position.z +=
      t.speed*dt;

    if(
      t.object.position.z>235
    ){

      t.object.position.z=-235;

    }

    if(
      t.object.position.z<-235
    ){

      t.object.position.z=235;

    }

  }


  for(
    const t of challengeCars
  ){

    t.object.position.x +=
      t.speed*dt;

    if(
      t.object.position.x>230
    ){

      t.object.position.x=20;

    }

  }

}


// ======================================================
// PEOPLE MOVEMENT
// ======================================================

function updatePeople(dt){

  for(
    const p of people
  ){

    p.object.position.z +=
      p.speed*
      p.direction*
      dt;

    if(
      p.object.position.z>205
    ){

      p.object.position.z=-205;

    }

    if(
      p.object.position.z<-205
    ){

      p.object.position.z=205;

    }

  }

}


// ======================================================
// CAMERA
// ======================================================

const desiredCamera=
new THREE.Vector3();

const target=
new THREE.Vector3();


function updateCamera(){

  const behind=
    new THREE.Vector3(
      0,
      6.5,
      10
    );

  behind.applyAxisAngle(
    new THREE.Vector3(0,1,0),
    player.rotation.y
  );

  desiredCamera.copy(
    player.position
  );

  desiredCamera.add(
    behind
  );


  // Camera never enters floor

  desiredCamera.y=
    Math.max(
      desiredCamera.y,
      player.position.y+2.5
    );


  camera.position.lerp(
    desiredCamera,
    .09
  );


  target.copy(
    player.position
  );

  target.y+=1.8;

  camera.lookAt(target);

}


// ======================================================
// LOCATION
// ======================================================

const locationBox=
document.getElementById(
  "location"
);


function updateLocation(){

  const x=
    player.position.x;

  const z=
    player.position.z;


  if(onFlyover){

    locationBox.textContent=
      "📍 POST OFFICE FLYOVER — UPPER ROAD";

    return;

  }


  if(
    x>55 &&
    z>-155 &&
    z<-75
  ){

    locationBox.textContent=
      "📍 POLICE STATION / SECOND FLYOVER";

    return;

  }


  if(
    z>-90 &&
    z<90
  ){

    locationBox.textContent=
      "📍 UNDER POST OFFICE FLYOVER";

    return;

  }


  if(z>120){

    locationBox.textContent=
      "📍 MARABA → GENERAL POST OFFICE";

    return;

  }


  if(z<-120){

    locationBox.textContent=
      "📍 CHALLENGE / OFFA GARAGE DIRECTION";

    return;

  }


  locationBox.textContent=
    "📍 ILORIN CITY STREETS";

}


// ======================================================
// CLOUDS
// ======================================================

function cloud(
  x,y,z
){

  const g=
    new THREE.Group();

  for(
    let i=0;
    i<5;
    i++
  ){

    const puff=
      new THREE.Mesh(
        new THREE.SphereGeometry(
          4+Math.random()*2,
          8,
          8
        ),
        new THREE.MeshStandardMaterial({
          color:0xffffff,
          transparent:true,
          opacity:.82
        })
      );

    puff.position.set(
      i*4,
      Math.random()*1.5,
      Math.random()*2
    );

    g.add(puff);

  }

  g.position.set(
    x,y,z
  );

  scene.add(g);

}

cloud(-80,55,-100);
cloud(70,70,-160);
cloud(10,62,120);


// ======================================================
// RESIZE
// ======================================================

addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


// ======================================================
// GAME LOOP
// ======================================================

function animate(){

  requestAnimationFrame(
    animate
  );

  const dt=
    Math.min(
      clock.getDelta(),
      .05
    );


  movePlayer(dt);

  updateTraffic(dt);

  updatePeople(dt);

  updateCamera();

  updateLocation();


  renderer.render(
    scene,
    camera
  );

}

animate();

</script>
