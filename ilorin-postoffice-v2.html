/* =====================================================
   JOYSTICK
===================================================== */

const joystick=
document.getElementById(
"joystick"
);

const stick=
document.getElementById(
"stick"
);

let joyX=0;
let joyY=0;
let active=false;
let pointerId=null;

const maxDistance=36;


function moveStick(x,y){

const r=
joystick.getBoundingClientRect();

const cx=
r.left+r.width/2;

const cy=
r.top+r.height/2;

let dx=x-cx;
let dy=y-cy;

const distance=
Math.sqrt(
dx*dx+dy*dy
);

if(distance>maxDistance){

dx=
dx/distance*
maxDistance;

dy=
dy/distance*
maxDistance;
}

joyX=
dx/maxDistance;

joyY=
dy/maxDistance;

stick.style.transform=
`translate(${dx}px,${dy}px)`;
}


function resetStick(){

active=false;
pointerId=null;

joyX=0;
joyY=0;

stick.style.transform=
"translate(0px,0px)";
}


joystick.addEventListener(
"pointerdown",
e=>{

active=true;
pointerId=e.pointerId;

joystick.setPointerCapture(
e.pointerId
);

moveStick(
e.clientX,
e.clientY
);
}
);


joystick.addEventListener(
"pointermove",
e=>{

if(
!active ||
e.pointerId!==pointerId
)return;

moveStick(
e.clientX,
e.clientY
);
}
);


joystick.addEventListener(
"pointerup",
resetStick
);

joystick.addEventListener(
"pointercancel",
resetStick
);

/* =====================================================
   CAMERA
===================================================== */

function updateCamera(delta){

const distance=7;
const height=4.3;


const desired=
new THREE.Vector3(

player.position.x -
Math.sin(
player.rotation.y
)*distance,

Math.max(
1.8,
player.position.y+height
),

player.position.z -
Math.cos(
player.rotation.y
)*distance

);


camera.position.lerp(
desired,
Math.min(
1,
delta*6
)
);


/*
 NEVER allow camera underground
*/

camera.position.y=
Math.max(
1.8,
camera.position.y
);


camera.lookAt(
player.position.x,
player.position.y+1.2,
player.position.z
);
}


/* =====================================================
   MOVEMENT UPDATE
===================================================== */

function updatePlayer(delta){

const forward=-joyY;
const turn=joyX;


if(
Math.abs(turn)>.05
){

player.rotation.y -=
turn*
turnSpeed*
delta;
}


if(
Math.abs(forward)>.05
){

const speed=
running
?runSpeed
:walkSpeed;


player.position.x +=
Math.sin(
player.rotation.y
)*
speed*
forward*
delta;


player.position.z +=
Math.cos(
player.rotation.y
)*
speed*
forward*
delta;
}


/* jump */

verticalVelocity+=
gravity*delta;

player.position.y+=
verticalVelocity*delta;


if(
player.position.y<=0
){

player.position.y=0;

verticalVelocity=0;

grounded=true;
}
}


/* =====================================================
   DAY / NIGHT
===================================================== */

let gameTime=12;


function updateTime(delta){

gameTime+=
delta*.03;

if(gameTime>=24)
gameTime-=24;


const hour=
Math.floor(gameTime);

const minute=
Math.floor(
(gameTime-hour)*60
);


document.getElementById(
"clock"
).textContent=
"🕐 "+
String(hour).padStart(2,"0")+
":"+
String(minute).padStart(2,"0");


const angle=
((gameTime-6)/24)*
Math.PI*2;


const daylight=
Math.max(
.12,
Math.sin(angle)*.5+.5
);


sun.position.set(
Math.cos(angle)*100,
Math.max(5,
Math.sin(angle)*100),
40
);


sun.intensity=
daylight*2;

ambient.intensity=
.3+daylight;


if(
gameTime>=6 &&
gameTime<18
){

scene.background=
new THREE.Color(
0x79bce8
);

}else{

scene.background=
new THREE.Color(
0x10172c
);
}
}


/* =====================================================
   ANIMATION
===================================================== */

const clock=
new THREE.Clock();


function animate(){

requestAnimationFrame(
animate
);

const delta=
Math.min(
clock.getDelta(),
.05
);

updatePlayer(delta);
updateCamera(delta);
updateTime(delta);

renderer.render(
scene,
camera
);
}


animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(

()=>{

camera.aspect=
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight

});
