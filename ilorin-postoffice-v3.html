function building(
  name,
  x,
  z,
  w,
  h,
  d,
  color
) {

  const b = box(
    w,
    h,
    d,
    mat(color),
    x,
    h / 2,
    z
  );

  // Roof
  box(
    w + .5,
    .3,
    d + .5,
    darkMat,
    x,
    h + .15,
    z
  );

  // Sign
  const sign = box(
    Math.min(w * .8, 12),
    1.8,
    .15,
    whiteMat,
    x,
    Math.min(h - 1.5, 7),
    z - d / 2 - .1
  );

  sign.userData.name = name;

  // Door
  box(
    1.5,
    2.5,
    .15,
    darkMat,
    x,
    1.25,
    z - d / 2 - .18
  );

  // Windows
  const rows = Math.max(
    1,
    Math.floor(h / 4)
  );

  for (
    let row = 0;
    row < rows;
    row++
  ) {

    const y = 3 + row * 3;

    if (y > h - 1) continue;

    box(
      1.6,
      1.3,
      .12,
      blueMat,
      x - w / 3,
      y,
      z - d / 2 - .16
    );

    box(
      1.6,
      1.3,
      .12,
      blueMat,
      x + w / 3,
      y,
      z - d / 2 - .16
    );

  }

  return b;

}

// ============================================================

let onFlyover = false;


function getFlyoverHeight(z) {

  // SOUTH RAMP
  if (
    z >= -85 &&
    z < -55
  ) {

    return (
      ((z + 85) / 30) *
      flyoverHeight
    );

  }


  // TOP
  if (
    z >= -55 &&
    z <= 55
  ) {

    return flyoverHeight;

  }


  // NORTH RAMP
  if (
    z > 55 &&
    z <= 85
  ) {

    return (
      ((85 - z) / 30) *
      flyoverHeight
    );

  }

  return 0;

}


// ============================================================
// JOYSTICK
// ============================================================

const joystick =
document.getElementById("joystick");

const stick =
document.getElementById("stick");

let joyX = 0;
let joyY = 0;

let touching = false;


function updateJoystick(
  clientX,
  clientY
) {

  const rect =
    joystick.getBoundingClientRect();

  let x =
    clientX -
    (rect.left + rect.width / 2);

  let y =
    clientY -
    (rect.top + rect.height / 2);

  const max = 42;

  const dist =
    Math.sqrt(
      x*x + y*y
    );

  if (dist > max) {

    x =
      x / dist * max;

    y =
      y / dist * max;

  }

  joyX = x / max;
  joyY = y / max;

  stick.style.transform =
    `translate(${x}px, ${y}px)`;

}


function resetJoystick() {

  joyX = 0;
  joyY = 0;

  stick.style.transform =
    "translate(0px,0px)";

  touching = false;

}


joystick.addEventListener(
  "pointerdown",
  e => {

    touching = true;

    joystick.setPointerCapture(
      e.pointerId
    );

    updateJoystick(
      e.clientX,
      e.clientY
    );

  }
);


joystick.addEventListener(
  "pointermove",
  e => {

    if (!touching) return;

    updateJoystick(
      e.clientX,
      e.clientY
    );

  }
);


joystick.addEventListener(
  "pointerup",
  resetJoystick
);

joystick.addEventListener(
  "pointercancel",
  resetJoystick
);


// ============================================================
// MOVEMENT
// ============================================================

const clock =
new THREE.Clock();

let walkTime = 0;


function movePlayer(dt) {

  const turnSpeed =
    2.4 * dt;

  const moveSpeed =
    15 * dt;


  // LEFT / RIGHT = TURN
  player.rotation.y -=
    joyX * turnSpeed;


  // UP / DOWN = FORWARD / BACK
  const forward =
    -joyY;


  if (
    Math.abs(forward) > .05
  ) {

    const direction =
      new THREE.Vector3(
        0,
        0,
        forward
      );

    direction.applyAxisAngle(
      new THREE.Vector3(0,1,0),
      player.rotation.y
    );

    player.position.addScaledVector(
      direction,
      moveSpeed
    );

    walkTime += dt * 10;

  }


  // ----------------------------------------------------------
  // FLYOVER ENTRY
  // ----------------------------------------------------------

  const z =
    player.position.z;

  const x =
    player.position.x;


  // Player enters ramp from either end
  if (
    Math.abs(x) < 7.1 &&
    (
      z > -87 &&
      z < -52
    )
  ) {

    onFlyover = true;

  }


  if (
    Math.abs(x) < 7.1 &&
    (
      z > 52 &&
      z < 87
    )
  ) {

    onFlyover = true;

  }


  // ----------------------------------------------------------
  // FLYOVER MOVEMENT
  // ----------------------------------------------------------

  if (onFlyover) {

    // Keep player on flyover width
    player.position.x =
      THREE.MathUtils.clamp(
        player.position.x,
        -6.4,
        6.4
      );


    const h =
      getFlyoverHeight(
        player.position.z
      );

    player.position.y = h;


    // Leave flyover
    if (
      player.position.z < -88 ||
      player.position.z > 88
    ) {

      onFlyover = false;
      player.position.y = 0;

    }

  } else {

    // Ground level.
    // This means you can walk UNDER the flyover.
    player.position.y = 0;

  }


  // World boundaries

  player.position.x =
    THREE.MathUtils.clamp(
      player.position.x,
      -145,
      145
    );

  player.position.z =
    THREE.MathUtils.clamp(
      player.position.z,
      -215,
      215
    );


  // Small walking animation

  if (
    Math.abs(forward) > .05
  ) {

    body.position.y =
      1.25 +
      Math.sin(walkTime) * .035;

  } else {

    body.position.y = 1.25;

  }

}


// ============================================================
// CAMERA
// ============================================================

const cameraTarget =
new THREE.Vector3();

const desiredCamera =
new THREE.Vector3();


function updateCamera() {

  const distance = 10;
  const height = 6.5;


  const behind =
    new THREE.Vector3(
      0,
      height,
      distance
    );


  behind.applyAxisAngle(
    new THREE.Vector3(0,1,0),
    player.rotation.y
  );


  desiredCamera.copy(
    player.position
  );

  desiredCamera.add(
    behind
  );


  // Camera can NEVER go below this
  desiredCamera.y =
    Math.max(
      desiredCamera.y,
      player.position.y + 2.2
    );


  camera.position.lerp(
    desiredCamera,
    .09
  );


  cameraTarget.copy(
    player.position
  );

  cameraTarget.y += 2;


  camera.lookAt(
    cameraTarget
  );

}


// ============================================================
// LOCATION HUD
// ============================================================

const location =
document.getElementById(
  "location"
);


function updateLocation() {

  const z =
    player.position.z;


  if (onFlyover) {

    location.textContent =
      "📍 POST OFFICE FLYOVER — UPPER DECK";

    return;

  }


  if (
    z > -88 &&
    z < 88
  ) {

    location.textContent =
      "📍 UNDER POST OFFICE FLYOVER";

    return;

  }


  if (z > 105) {

    location.textContent =
      "📍 MARABA → GENERAL POST OFFICE";

    return;

  }


  if (z < -105) {

    location.textContent =
      "📍 POST OFFICE → CHALLENGE";

    return;

  }


  location.textContent =
    "📍 POST OFFICE DISTRICT — ILORIN";

}


// ============================================================
// DAY / NIGHT
// ============================================================

const timeBox =
document.getElementById("time");

let worldTime = 12;


function updateDayNight(dt) {

  worldTime +=
    dt * .08;

  if (worldTime >= 24)
    worldTime = 0;


  const daylight =
    Math.max(
      0,
      Math.sin(
        (worldTime - 6) /
        12 *
        Math.PI
      )
    );


  sun.intensity =
    .35 +
    daylight * 2.1;


  hemi.intensity =
    .45 +
    daylight * 1.35;


  if (
    worldTime >= 6 &&
    worldTime < 18
  ) {

    scene.background =
      new THREE.Color(
        0x87ceeb
      );

    scene.fog.color =
      new THREE.Color(
        0x87ceeb
      );

    timeBox.textContent =
      "☀️ Day";

  } else {

    scene.background =
      new THREE.Color(
        0x11182e
      );

    scene.fog.color =
      new THREE.Color(
        0x11182e
      );

    timeBox.textContent =
      "🌙 Night";

  }

}


// ============================================================
// CLOUDS
// ============================================================

function cloud(x,y,z) {

  const group =
    new THREE.Group();

  for (
    let i = 0;
    i < 5;
    i++
  ) {

    const puff =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          5 + Math.random() * 3,
          10,
          8
        ),
        new THREE.MeshStandardMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: .85
        })
      );

    puff.position.set(
      i * 5,
      Math.random() * 2,
      Math.random() * 3
    );

    group.add(puff);

  }

  group.position.set(
    x,
    y,
    z
  );

  scene.add(group);

}


cloud(-70, 55, -100);
cloud(80, 70, -160);
cloud(20, 62, 120);


// ============================================================
// SIMPLE RAIN
// ============================================================

const rainGroup =
new THREE.Group();

scene.add(rainGroup);

for (
  let i = 0;
  i < 300;
  i++
) {

  const drop =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .025,
        1.3,
        .025
      ),
      new THREE.MeshBasicMaterial({
        color: 0x9ccfff,
        transparent: true,
        opacity: .45
      })
    );

  drop.position.set(
    (Math.random() - .5) * 300,
    Math.random() * 100,
    (Math.random() - .5) * 300
  );

  rainGroup.add(drop);

}

rainGroup.visible = false;


function updateRain(dt) {

  if (
    Math.random() < .0008
  ) {

    rainGroup.visible =
      !rainGroup.visible;

  }

  if (!rainGroup.visible)
    return;


  for (
    const drop of rainGroup.children
  ) {

    drop.position.y -=
      30 * dt;

    if (
      drop.position.y < 0
    ) {

      drop.position.y =
        80 + Math.random() * 20;

    }

  }

}


// ============================================================
// RESIZE
// ============================================================

addEventListener(
  "resize",
  () => {

    camera.aspect =
      innerWidth /
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


// ============================================================
// GAME LOOP
// ============================================================

function animate() {

  requestAnimationFrame(
    animate
  );

  const dt =
    Math.min(
      clock.getDelta(),
      .05
    );


  movePlayer(dt);

  updateCamera();

  updateLocation();

  updateDayNight(dt);

  updateRain(dt);


  renderer.render(
    scene,
    camera
  );

}


animate();

</script>
