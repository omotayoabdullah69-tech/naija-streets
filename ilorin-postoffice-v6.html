   NAIJA STREETS V6
   Ilorin: Post Office → Challenge → A-Division

===================================================== */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(

  antialias: true,

/* ---------- MATERIALS ---------- */

function mat(color, roughness=0.9, extra={}) {
  return new THREE.MeshStandardMaterial({
    color, roughness, ...extra
  });
}

const grassMat = mat(0x777c45);
const roadMat = mat(0x33383c);
const concreteMat = mat(0x9b9a91);
const sidewalkMat = mat(0xb8b3a4);
const whiteMat = mat(0xf1eee2);
const yellowMat = mat(0xffc52b);
const blackMat = mat(0x17191b);
const redMat = mat(0xc83e2c);
const blueMat = mat(0x245d96);
const greenMat = mat(0x297a42);

function box(parent, x,y,z, w,h,d, material, cast=true) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d), material
  );
  mesh.position.set(x,y+h/2,z);
  mesh.castShadow = cast;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function cylinder(parent,x,y,z,rt,rb,h,material,segments=10) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(rt,rb,h,segments),material
  );
  mesh.position.set(x,y+h/2,z);
  mesh.castShadow=true;
  parent.add(mesh);
  return mesh;
}

/* ---------- BUILDINGS WITH SIGNBOARDS ---------- */

function signTexture(text,color="#173f32"){
  const canvas=document.createElement("canvas");
  canvas.width=512; canvas.height=128;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle=color; ctx.fillRect(0,0,512,128);
  ctx.fillStyle="#ffffff";
  ctx.font="bold 38px Arial";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(text,256,64,480);
  const tex=new THREE.CanvasTexture(canvas);
  tex.colorSpace=THREE.SRGBColorSpace;
  return tex;
}

function building(x,z,w,h,d,name,options={}){
  const group=new THREE.Group();
  group.position.set(x,0,z);
  scene.add(group);

  const colors=[
    0xd7c4a4,0xc9b49a,0xe3d7c1,0xc6c4b8,
    0xd5c8af,0xb9c7c4,0xc8b6a3,0xd9d4c7
  ];
  const color=options.color || colors[Math.floor(Math.random()*colors.length)];
  box(group,0,0,0,w,h,d,mat(color),true);

  /* Roof ledge */
  box(group,0,h,0,w+0.5,0.22,d+0.5,mat(0x77756b));

  /* Front-facing entrance, windows and sign */
  const front=-d/2-0.04;
  box(group,0,Math.min(2,h*0.65),front,Math.min(w*0.72,8),0.6,0.12,
      mat(options.signColor || 0x25513b));

  const sign=new THREE.Mesh(
    new THREE.PlaneGeometry(Math.min(w*0.85,10),0.9),
    new THREE.MeshStandardMaterial({
      map:signTexture(name,options.textColor || "#173f32"),
      roughness:0.8
    })
  );
  sign.position.set(0,Math.min(2.35,h*0.65+0.1),front-0.08);
  group.add(sign);

  /* Windows */
  const winMat=mat(0x7294a0,0.35,{
    metalness:0.15
  });
  const cols=Math.max(1,Math.floor(w/3.2));
  const rows=Math.max(1,Math.floor((h-2.8)/2.8));

  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const wx=-w/2+(c+0.5)*w/cols;
      const wy=1.8+r*2.6;
      if(wy<h-0.8){
        box(group,wx,wy,front-0.03,0.9,1.25,0.06,winMat,false);
      }
    }
  }

  /* Front doorway */
  box(group,-w*0.28,0.05,front-0.06,1.3,2.15,0.12,mat(0x44362c));

  return group;
}

/* ---------- FLYOVERS ---------- */

/*
  Flyover geometry:
  Long ramps rise gradually to a raised bridge deck.
  Main ground road remains open underneath.
*/
const flyovers=[
  {center:-5,length:75,height:6.5},
  {center:255,length:80,height:6.5}
];

function rampHeight(z,f){
  const start=f.center-f.length/2;
  const end=f.center+f.length/2;
  const rampLength=23;
  const deckStart=start+rampLength;
  const deckEnd=end-rampLength;

  if(z<start || z>end) return 0;
  if(z<deckStart) return f.height*(z-start)/rampLength;
  if(z>deckEnd) return f.height*(end-z)/rampLength;
  return f.height;
}

function createFlyover(f,index){
  const start=f.center-f.length/2;
  const end=f.center+f.length/2;
  const rampLength=23;
  const deckStart=start+rampLength;
  const deckEnd=end-rampLength;

  /* Raised road deck */
  box(scene,0,f.height, (deckStart+deckEnd)/2,
      10.5,0.35,deckEnd-deckStart,roadMat);

  /* Side safety barriers */
  for(const side of [-1,1]){
    box(scene,side*5.1,f.height+0.3,(deckStart+deckEnd)/2,
        0.35,0.65,deckEnd-deckStart,concreteMat);

    /* Concrete support piers */
    for(let z=deckStart+8;z<deckEnd;z+=18){
      box(scene,side*3.7,0.05,z,0.8,f.height,0.9,concreteMat);
    }

    /* Ramp segments */
    const n=16;
    for(let i=0;i<n;i++){
      const t=(i+0.5)/n;
      const z1=start+t*rampLength;
      const z2=end-t*rampLength;
      const h1=f.height*t;
      const h2=f.height*t;

      const a=box(scene,side*0, h1, z1,10.5,0.28,rampLength/n+0.1,roadMat);
      a.rotation.x=-Math.atan(f.height/rampLength);
      a.position.y=h1+0.1;

      const b=box(scene,0,h2,z2,10.5,0.28,rampLength/n+0.1,roadMat);
      b.rotation.x=Math.atan(f.height/rampLength);
      b.position.y=h2+0.1;
    }
  }

  /* Painted deck markings */
  for(let z=deckStart;z<deckEnd;z+=7){
    box(scene,0,f.height+0.2,z,0.13,0.025,3.5,whiteMat,false);
  }

  /* Flyover name signs */
  const signGroup=new THREE.Group();
  signGroup.position.set(0, f.height+3, f.center);
  scene.add(signGroup);
  box(signGroup,0,0,0,5,1.2,0.2,mat(0x17583b));
  const label=index===0?"POST OFFICE FLYOVER":"A-DIVISION FLYOVER";
  const labelMesh=new THREE.Mesh(
    new THREE.PlaneGeometry(4.7,0.8),
    new THREE.MeshBasicMaterial({map:signTexture(label,"#17583b")})
  );
  labelMesh.position.set(0,0.05,0.12);
  signGroup.add(labelMesh);
}

flyovers.forEach((f,i)=>createFlyover(f,i));

/* ---------- VEHICLES ---------- */

const vehicles=[];
const vehicleColors=[
  0xf1f0e8,0x222b32,0xc93b2f,0x1c5eaa,0xe4b72d,
  0x777777,0x31794a,0xb8b6b0,0x8c3f85,0x2c3035
];

function makeVehicle(x,z,color,bus=false){
  const g=new THREE.Group();
  g.position.set(x,0.15,z);
  scene.add(g);

  const length=bus?8:4.2;
  const width=bus?2.4:1.85;
  const height=bus?3:1.5;

  box(g,0,0,0,width,height,length,mat(color,0.55));
  box(g,0,height*0.65,-length*0.08,width*0.86,height*0.38,length*0.53,
      mat(bus?0xd8dfe0:0x6e8997,0.25,{metalness:0.15}));

  /* Windshield */
  box(g,0,height*0.58,-length*0.48,width*0.78,height*0.3,0.08,
      mat(0x526e7c,0.25));

  /* Wheels */
  for(const wx of [-width*0.52,width*0.52]){
    for(const wz of [-length*0.31,length*0.31]){
      const wheel=new THREE.Mesh(
        new THREE.CylinderGeometry(0.38,0.38,0.2,10),
        blackMat
      );
      wheel.rotation.z=Math.PI/2;
      wheel.position.set(wx,0.15,wz);
      g.add(wheel);
    }
  }

  /* Headlights */
  const headlights=[];
  for(const hx of [-width*0.32,width*0.32]){
    const lamp=new THREE.Mesh(
      new THREE.BoxGeometry(0.42,0.24,0.12),
      new THREE.MeshStandardMaterial({
        color:0xfff2c1,
        emissive:0xffe5a1,
        emissiveIntensity:0.5
      })
    );
    lamp.position.set(hx,height*0.42,-length/2-0.06);
    g.add(lamp);
    headlights.push(lamp);
  }

  const light=new THREE.PointLight(0xffe6a4,0,12);
  light.position.set(0,height*0.4,-length/2);
  g.add(light);

  vehicles.push({
    group:g,
    speed:2+Math.random()*2.3,
    direction:Math.random()<0.5?-1:1,
    headlights,
    light,
    stopped:false,
    bus,
    baseX:x,
    baseZ:z,
    length
  });
}

/* ---------- PEDESTRIANS ---------- */

const people=[];
const skinTones=[0x8c5938,0x5f3927,0xb87c50,0x70442c,0x9a6748];
const shirtColors=[0x2464a2,0xc43d30,0xd6a72c,0x35814c,0xe3ddd1,0x713f81];

function person(x,z){

  const skin=mat(skinTones[Math.floor(Math.random()*skinTones.length)]);

  const head=new THREE.Mesh(new THREE.SphereGeometry(0.2,8,7),skin);
  head.position.set(0,1.15,0);
  g.add(head);

  box(g,-0.12,0.05,0,0.13,0.65,0.14,legMat);
  box(g,0.12,0.05,0,0.13,0.65,0.14,legMat);

  box(g,-0.31,0.32,0,0.12,0.65,0.12,shirt);
  box(g,0.31,0.32,0,0.12,0.65,0.12,shirt);

  people.push({
    group:g,
    originX:x,
    originZ:z,
    phase:Math.random()*Math.PI*2,
    speed:0.4+Math.random()*0.5
  });
}

body.castShadow=true;
player.add(body);

const head=new THREE.Mesh(
  new THREE.SphereGeometry(0.27,12,10),
  mat(0x8c5938)
);
head.position.y=1.78;
head.castShadow=true;
player.add(head);

/* Shoes */
box(player,-0.2,0.03,-0.08,0.22,0.12,0.4,blackMat);
box(player,0.2,0.03,-0.08,0.22,0.12,0.4,blackMat);

/* ---------- JOYSTICK ---------- */

const stickArea=document.getElementById("stickArea");
const stick=document.getElementById("stick");
let joyX=0,joyY=0;
let activePointer=null;

function resetStick(){
  joyX=0;joyY=0;
  stick.style.left="40px";
  stick.style.top="40px";
}

stickArea.addEventListener("pointerdown",e=>{
  e.preventDefault();
  activePointer=e.pointerId;
  stickArea.setPointerCapture(e.pointerId);
  updateStick(e);
});

stickArea.addEventListener("pointermove",e=>{
  if(e.pointerId!==activePointer)return;
  e.preventDefault();
  updateStick(e);
});

function updateStick(e){
  const rect=stickArea.getBoundingClientRect();
  const cx=rect.left+rect.width/2;
  const cy=rect.top+rect.height/2;
  let dx=e.clientX-cx;
  let dy=e.clientY-cy;
  const max=43;
  const len=Math.hypot(dx,dy);
  if(len>max){dx=dx/len*max;dy=dy/len*max;}
  joyX=dx/max;
  joyY=dy/max;
  stick.style.left=(40+dx)+"px";
  stick.style.top=(40+dy)+"px";
}

function endStick(e){
  if(e.pointerId!==activePointer)return;
  activePointer=null;
  resetStick();
}
stickArea.addEventListener("pointerup",endStick);
stickArea.addEventListener("pointercancel",endStick);
stickArea.addEventListener("lostpointercapture",()=>{activePointer=null;resetStick();});

/* ---------- FLYOVER PLAYER HEIGHT ---------- */

function flyoverHeight(z){
  let h=0;
  for(const f of flyovers){
    h=Math.max(h,rampHeight(z,f));
  }
  return h;
}

function roadHeight(x,z){
  /* Only the central flyover deck raises the player */
  if(Math.abs(x)<4.8){
    return flyoverHeight(z);
  }
  return 0;
}

/* ---------- TRAFFIC STOP / HEADLIGHT BEHAVIOUR ---------- */

function vehicleIsFacingPlayer(v){
  const car=v.group;
  const dx=player.position.x-car.position.x;
  const dz=player.position.z-car.position.z;
  const dist=Math.hypot(dx,dz);
  if(dist>11)return false;

  /* Cars face their local negative Z direction when moving forward */
  const forward=new THREE.Vector3(0,0,-1)
    .applyQuaternion(car.quaternion);
  const toward=new THREE.Vector3(dx,0,dz).normalize();

  return forward.dot(toward)>0.65;
}

/* ---------- CLOUDS ---------- */

const clouds=[];
const cloudMat=new THREE.MeshStandardMaterial({
  color:0xffffff,
  roughness:1
});

function cloud(x,y,z,size=1){
  const g=new THREE.Group();
  g.position.set(x,y,z);
  scene.add(g);

  const parts=[
    [-1,0,0,1.5],
    [0.2,0.4,0,1.8],
    [1.3,0,0,1.4],
    [0.3,-0.15,0.6,1.4]
  ];

  for(const p of parts){
    const m=new THREE.Mesh(
      new THREE.SphereGeometry(p[3]*size,8,7),
      cloudMat
    );
    m.position.set(p[0]*size,p[1]*size,p[2]*size);
    g.add(m);
  }
  clouds.push({group:g,speed:0.25+Math.random()*0.25});
}
for(let i=0;i<24;i++){
  cloud(-200+Math.random()*400,65+Math.random()*45,
        -450+Math.random()*1000,0.7+Math.random()*1.5);
}

/* ---------- RAIN ---------- */

let raining=false;
const rainCount=700;
const rainPositions=new Float32Array(rainCount*3);
for(let i=0;i<rainCount;i++){
  rainPositions[i*3]=(Math.random()-0.5)*120;
  rainPositions[i*3+1]=Math.random()*80;
  rainPositions[i*3+2]=(Math.random()-0.5)*160;
}
const rainGeometry=new THREE.BufferGeometry();
rainGeometry.setAttribute(
  "position",new THREE.BufferAttribute(rainPositions,3)
);
const rainMaterial=new THREE.PointsMaterial({
  color:0xd7e8f4,
  size:0.14,
  transparent:true,
  opacity:0.7
});
const rain=new THREE.Points(rainGeometry,rainMaterial);
rain.visible=false;
scene.add(rain);

document.getElementById("rainToggle").addEventListener("click",()=>{
  raining=!raining;
  rain.visible=raining;
  document.getElementById("rainToggle").textContent=
    raining?"🌧️ Rain: ON":"🌧️ Rain: OFF";
  document.getElementById("weather").textContent=
    raining?"🌧️ Rainy weather in Ilorin":"☀️ Daytime in Ilorin";
});

/* ---------- LOCATION HUD ---------- */

function getLocation(z){
  if(z < 25) return "General Post Office";
  if(z < 95) return "Post Office / Challenge";
  if(z < 200) return "Challenge Commercial Area";
  if(z < 290) return "A-Division Police Station";
  if(z < 365) return "A-Division / Offa Garage";
  if(z < 470) return "Offa Garage Corridor";
  return "Olunlade";
}

/* ---------- GAME LOOP ---------- */

const clock=new THREE.Clock();
let elapsed=0;
let noticeCooldown=0;

camera.position.set(-9,7,-55);
camera.lookAt(player.position);

function animate(){
  requestAnimationFrame(animate);

  const dt=Math.min(clock.getDelta(),0.045);
  elapsed+=dt;

  /* Left joystick: horizontal turns; vertical moves */
  const turn=-joyX*2.0*dt;
  player.rotation.y+=turn;

  const forward=-joyY;
  const walking=Math.abs(forward)>0.04;

  if(walking){
    const speed=forward>0?8:5;
    const dx=Math.sin(player.rotation.y)*forward*speed*dt;
    const dz=-Math.cos(player.rotation.y)*forward*speed*dt;
    player.position.x+=dx;
    player.position.z+=dz;
  }

  /* Keep player in the walkable city area */
  player.position.x=THREE.MathUtils.clamp(player.position.x,-70,70);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-490,640);

  /* Smooth flyover height */
  const groundY=roadHeight(player.position.x,player.position.z);
  player.position.y=THREE.MathUtils.lerp(player.position.y,groundY+0.1,0.25);

  /* Slight walking bob */
  body.position.y=1+(walking?Math.abs(Math.sin(elapsed*10))*0.05:0);

  /* Camera follows from behind */
  const behind=new THREE.Vector3(
    Math.sin(player.rotation.y)*10,
    6.3,
    Math.cos(player.rotation.y)*10
  );
  const targetCamera=player.position.clone().add(behind);
  targetCamera.y=Math.max(targetCamera.y,player.position.y+4.2);

  camera.position.lerp(targetCamera,0.09);
  const lookTarget=player.position.clone();
  lookTarget.y+=1.6;
  camera.lookAt(lookTarget);

  /* Clouds drift across the sky */
  for(const c of clouds){
    c.group.position.x+=c.speed*dt;
    if(c.group.position.x>240)c.group.position.x=-240;
  }

  /* Rain falls around player */
  if(raining){
    rain.position.set(player.position.x,0,player.position.z);
    const pos=rain.geometry.attributes.position;
    for(let i=0;i<rainCount;i++){
      pos.array[i*3+1]-=25*dt;
      if(pos.array[i*3+1]<0){
        pos.array[i*3+1]=65+Math.random()*20;
      }
    }
    pos.needsUpdate=true;
  }

  /* Traffic moves along the road and stops for the player */
  for(const v of vehicles){
    const g=v.group;
    const dist=g.position.distanceTo(player.position);
    v.stopped=vehicleIsFacingPlayer(v);

    if(v.stopped){
      v.headlights.forEach(l=>{
        l.material.emissiveIntensity=1.9;
      });
      v.light.intensity=1.6;
    }else{
      v.headlights.forEach(l=>{
        l.material.emissiveIntensity=0.45;
      });
      v.light.intensity=0;
    }

    if(!v.stopped){
      g.position.z+=v.direction*v.speed*dt;

      if(g.position.z>650)g.position.z=-480;
      if(g.position.z<-480)g.position.z=650;
    }
  }

  /* Pedestrians walk along the sidewalks */
  for(const p of people){
    p.phase+=dt*p.speed;
    p.group.position.z=p.originZ+Math.sin(p.phase)*1.8;
    p.group.rotation.y=Math.sin(p.phase)*0.25;
  }

  /* Keep the location display updated */
  document.getElementById("location").textContent=getLocation(player.position.z);

  /* Friendly prompt */
  noticeCooldown-=dt;
  if(noticeCooldown<=0){
    const nearCar=vehicles.some(v=>
      v.group.position.distanceTo(player.position)<7
    );
    if(nearCar){
      document.getElementById("notice").textContent=
        "🚗 A vehicle is near you!";
      noticeCooldown=2;
    }else if(player.position.z>230&&player.position.z<290){
      document.getElementById("notice").textContent=
        "🚔 You are near A-Division Police Station";
      noticeCooldown=2;
    }else{
      document.getElementById("notice").textContent=
        "Explore the streets of Ilorin!";
    }
  }

  renderer.render(scene,camera);
}

/* ---------- RESIZE ---------- */

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* ---------- START ---------- */

camera.position.set(-9,7,-55);
document.getElementById("loading").style.display="none";
animate();

</script>
