// ============================================================
// FLYOVER BUILDER
// ============================================================

function makeFlyover(
 centerX,
 centerZ,
 direction
){

 /*
  direction 0:
  flyover runs north/south

  direction 1:
  flyover runs east/west
 */

 const height=8;
 const width=15;
 const deckLength=105;

 let deck;

 if(direction===0){

  deck =
  box(
   width,
   .7,
   deckLength,
   roadMat,
   centerX,
   height,
   centerZ
  );

 }else{

  deck =
  box(
   deckLength,
   .7,
   width,
   roadMat,
   centerX,
   height,
   centerZ
  );

 }


 // rails

 if(direction===0){

  box(
   .45,
   1.25,
   deckLength,
   concreteMat,
   centerX-8,
   height+.7,
   centerZ
  );

  box(
   .45,
   1.25,
   deckLength,
   concreteMat,
   centerX+8,
   height+.7,
   centerZ
  );

 }else{

  box(
   deckLength,
   1.25,
   .45,
   concreteMat,
   centerX,
   height+.7,
   centerZ-8
  );

  box(
   deckLength,
   1.25,
   .45,
   concreteMat,
   centerX,
   height+.7,
   centerZ+8
  );

 }


 // supports

 for(
  let i=-40;
  i<=40;
  i+=20
 ){

  if(direction===0){

   box(
    1.8,
    height,
    1.8,
    concreteMat,
    centerX-6,
    height/2,
    centerZ+i
   );

   box(
    1.8,
    height,
    1.8,
    concreteMat,
    centerX+6,
    height/2,
    centerZ+i
   );

  }else{

   box(
    1.8,
    height,
    1.8,
    concreteMat,
    centerX+i,
    height/2,
    centerZ-6
   );

   box(
    1.8,
    height,
    1.8,
    concreteMat,
    centerX+i,
    height/2,
    centerZ+6
   );

  }

 }


 // lane markings

 for(
  let i=-42;
  i<=42;
  i+=12
 ){

  if(direction===0){

   mark(
    centerX,
    height+.37,
    centerZ+i,
    .35,
    6,
    yellowMat
   );

  }else{

   mark(
    centerX+i,
    height+.37,
    centerZ,
    6,
    .35,
    yellowMat
   );

  }

 }

}

// ============================================================
// VEHICLES
// ============================================================

function createVehicle(
 x,z,
 color,
 rotation=0,
 scale=1
){

 const g =
 new THREE.Group();

 const body =
 new THREE.Mesh(
  new THREE.BoxGeometry(
   3.9*scale,
   1.25*scale,
   6.4*scale
  ),
  mat(color)
 );

 body.position.y=
  1.05*scale;

 body.castShadow=true;

 g.add(body);


 const cabin =
 new THREE.Mesh(
  new THREE.BoxGeometry(
   3.1*scale,
   1.05*scale,
   3.1*scale
  ),
  glassMat
 );

 cabin.position.y=
  2.02*scale;

 cabin.position.z=
  -.25*scale;

 g.add(cabin);


 // wheels

 for(
  const sx of [-1,1]
 ){

  for(
   const sz of [-2.1,2.1]
  ){

   const wheel =
   new THREE.Mesh(
    new THREE.CylinderGeometry(
     .53*scale,
     .53*scale,
     .32*scale,
     10
    ),
    darkMat
   );

   wheel.rotation.z=
    Math.PI/2;

   wheel.position.set(
    sx*1.9*scale,
    .55*scale,
    sz*scale
   );

   g.add(wheel);

  }

 }


 // headlights

 const headMaterial =
 new THREE.MeshStandardMaterial({
  color:0xffffbb,
  emissive:0xffff66,
  emissiveIntensity:.7
 });

 const head1 =
 new THREE.Mesh(
  new THREE.BoxGeometry(
   .35*scale,
   .22*scale,
   .08*scale
  ),
  headMaterial
 );

 const head2 =
 head1.clone();

 head1.position.set(
  -.95*scale,
  1.15*scale,
  -3.22*scale
 );

 head2.position.set(
  .95*scale,
  1.15*scale,
  -3.22*scale
 );

 g.add(head1);
 g.add(head2);


 // brake lights

 const brakeMaterial =
 new THREE.MeshStandardMaterial({
  color:0xff1111,
  emissive:0xff0000,
  emissiveIntensity:.3
 });

 const brake1 =
 new THREE.Mesh(
  new THREE.BoxGeometry(
   .35*scale,
   .22*scale,
   .08*scale
  ),
  brakeMaterial
 );

 const brake2 =
 brake1.clone();

 brake1.position.set(
  -.95*scale,
  1.15*scale,
  3.22*scale
 );

 brake2.position.set(
  .95*scale,
  1.15*scale,
  3.22*scale
 );

 g.add(brake1);
 g.add(brake2);


 g.position.set(
  x,
  0,
  z
 );

 g.rotation.y=
  rotation;

 scene.add(g);

 return {
  object:g,
  headlights:[
   head1,
   head2
  ],
  brakes:[
   brake1,
   brake2
  ],
  speed:0,
  baseSpeed:0
 };

}

function createPerson(

 shirt,
 pants,
 scale=.8
){

 const g =
 new THREE.Group();


 const body =
 new THREE.Mesh(
  new THREE.CylinderGeometry(
   .25*scale,
   .32*scale,
   1.05*scale,
   7
  ),
  mat(shirt)
 );

 body.position.y=
  1.05*scale;

 g.add(body);


 const head =
 new THREE.Mesh(
  new THREE.SphereGeometry(
   .27*scale,
   8,
   8
  ),
  mat(0x70452c)
 );

 head.position.y=
  1.75*scale;

 g.add(head);


 const leg =
 new THREE.Mesh(
  new THREE.BoxGeometry(
   .18*scale,
   .7*scale,
   .18*scale
  ),
  mat(pants)
 );

 leg.position.set(
  -.12*scale,
  .35*scale,
  0
 );

 g.add(leg);


 const leg2 =
 leg.clone();

 leg2.position.x=
  .12*scale;

 g.add(leg2);


 g.position.set(
  x,
  0,
  z
 );

 scene.add(g);

 return g;

}

const joystick =
document.getElementById(
 "joystick"
);

const stick =
document.getElementById(
 "stick"
);

let joyX=0;
let joyY=0;
let touching=false;


function joystickMove(
 x,y
){

 const r =
 joystick.getBoundingClientRect();

 let dx =
 x-(r.left+r.width/2);

 let dy =
 y-(r.top+r.height/2);

 const max=42;

 const distance =
 Math.sqrt(
  dx*dx+dy*dy
 );

 if(distance>max){

  dx=
   dx/distance*max;

  dy=
   dy/distance*max;

 }

 joyX=dx/max;
 joyY=dy/max;

 stick.style.transform=
 `translate(${dx}px,${dy}px)`;

}


function resetJoystick(){

 joyX=0;
 joyY=0;

 stick.style.transform=
 "translate(0,0)";

 touching=false;

}


joystick.addEventListener(
 "pointerdown",
 e=>{

  touching=true;

  joystick.setPointerCapture(
   e.pointerId
  );

  joystickMove(
   e.clientX,
   e.clientY
  );

 }
);


joystick.addEventListener(
 "pointermove",
 e=>{

  if(touching){

   joystickMove(
    e.clientX,
    e.clientY
   );

  }

 }
);


joystick.addEventListener(
 "pointerup",
 resetJoystick
);

joystick.addEventListener(
 "pointercancel",
 resetJoystick
);


// ============================================================
// FLYOVER HEIGHT / COLLISION
// ============================================================

let activeBridge=null;


// first bridge

function firstHeight(
 x,z
){

 if(
  Math.abs(x)>7.2
 )
 return 0;

 const start=35-67;
 const end=35+67;

 if(
  z>=start &&
  z<start+32
 ){

  return(
   ((z-start)/32)*8
  );

 }

 if(
  z>=start+32 &&
  z<=end-32
 ){

  return 8;

 }

 if(
  z>end-32 &&
  z<=end
 ){

  return(
   ((end-z)/32)*8
  );

 }

 return 0;

}


// second bridge

function secondHeight(
 x,z
){

 if(
  Math.abs(z+175)>7.2
 )
 return 0;

 const start=85-67;
 const end=85+67;

 if(
  x>=start &&
  x<start+32
 ){

  return(
   ((x-start)/32)*8
  );

 }

 if(
  x>=start+32 &&
  x<=end-32
 ){

  return 8;

 }

 if(
  x>end-32 &&
  x<=end
 ){

  return(
   ((end-x)/32)*8
  );

 }

 return 0;

}


// ============================================================
// PLAYER MOVEMENT
// ============================================================

const clock =
new THREE.Clock();

let walkTime=0;


function movePlayer(dt){

 const turnSpeed=
  2.5*dt;

 const moveSpeed=
  15*dt;


 // turn

 player.rotation.y -=
  joyX*turnSpeed;


 // movement

 const forward=
  -joyY;

 if(
  Math.abs(forward)>.05
 ){

  const dir =
  new THREE.Vector3(
   0,
   0,
   forward
  );

  dir.applyAxisAngle(
   new THREE.Vector3(0,1,0),
   player.rotation.y
  );

  player.position.addScaledVector(
   dir,
   moveSpeed
  );

  walkTime+=dt*10;

 }


 const x=
  player.position.x;

 const z=
  player.position.z;


 // ----------------------------------------------------------
 // FIRST BRIDGE
 // ----------------------------------------------------------

 const h1=
  firstHeight(x,z);


 // ----------------------------------------------------------
 // SECOND BRIDGE
 // ----------------------------------------------------------

 const h2=
  secondHeight(x,z);


 if(h1>0){

  activeBridge=1;

  player.position.y=h1;

  // keep player on bridge width
  player.position.x=
   THREE.MathUtils.clamp(
    player.position.x,
    -6.3,
    6.3
   );

 }else if(h2>0){

  activeBridge=2;

  player.position.y=h2;

  player.position.z=
   THREE.MathUtils.clamp(
    player.position.z,
    -181.3,
    -168.7
   );

 }else{

  activeBridge=null;

  player.position.y=0;

 }


 // world boundary

 player.position.x=
  THREE.MathUtils.clamp(
   player.position.x,
   -180,
   240
  );

 player.position.z=
  THREE.MathUtils.clamp(
   player.position.z,
   -350,
   250
  );


 // walk animation

 if(
  Math.abs(forward)>.05
 ){

  playerBody.position.y=
   1.25+
   Math.sin(walkTime)*.04;

 }else{

  playerBody.position.y=
   1.25;

 }

}


// ============================================================
// VEHICLE PLAYER DETECTION
// ============================================================

function updateTraffic(dt){

 let stopped=false;


 for(
  const car of cars
 ){

  const obj=
   car.object;


  let dx=
   player.position.x-
   obj.position.x;

  let dz=
   player.position.z-
   obj.position.z;


  const distance=
   Math.sqrt(
    dx*dx+dz*dz
   );


  /*
   Cars stop when the player
   is directly close to them.
  */

  if(
   distance<8
  ){

   car.speed=0;

   stopped=true;

   // flash headlights

   const flash=
    Math.sin(
     performance.now()/120
    )>.15;

   for(
    const light of
    car.headlights
   ){

    light.material.emissiveIntensity=
     flash ? 3 : .3;

   }


   // brake lights

   for(
    const brake of
    car.brakes
   ){

    brake.material.emissiveIntensity=
     3;

   }

  }else{

   car.speed=
    car.baseSpeed;

   for(
    const light of
    car.headlights
   ){

    light.material.emissiveIntensity=
     .7;

   }

   for(
    const brake of
    car.brakes
   ){

    brake.material.emissiveIntensity=
     .3;

   }

  }


  if(
   car.axis==="x"
  ){

   obj.position.x+=
    car.speed*dt;

   if(
    obj.position.x>235
   ){

    obj.position.x=-30;

   }

  }else{

   obj.position.z+=
    car.speed*dt;

   if(
    obj.position.z>260
   ){

    obj.position.z=-350;

   }

   if(
    obj.position.z<-350
   ){

    obj.position.z=260;

   }

  }

 }


 document.getElementById(
  "traffic"
 ).textContent=
 stopped
 ? "🛑 Traffic: Vehicle stopped"
 : "🚗 Traffic: Normal";

}

// ============================================================

const desiredCamera=
new THREE.Vector3();

const cameraTarget=
new THREE.Vector3();


function updateCamera(){

 const behind=
 new THREE.Vector3(
  0,
  6.5,
  10
 );

 behind.applyAxisAngle(
  new THREE.Vector3(0,1,0),
  player.rotation.y
 );


 desiredCamera.copy(
  player.position
 );

 desiredCamera.add(
  behind
 );


 // camera never enters ground

 desiredCamera.y=
  Math.max(
   desiredCamera.y,
   player.position.y+2.6
  );


 camera.position.lerp(
  desiredCamera,
  .09
 );


 cameraTarget.copy(
  player.position
 );

 cameraTarget.y+=1.8;

 camera.lookAt(
  cameraTarget
 );

}
