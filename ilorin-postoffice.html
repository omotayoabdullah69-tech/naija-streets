/* =====================================================

===================================================== */

function building(
  x,
  z,
  width,
  height,
  depth,
  color,
  name
) {

  const group =
    new THREE.Group();


  const body =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        width,
        height,
        depth
      ),

      new THREE.MeshStandardMaterial({
        color: color,
        roughness: .85
      })
    );

  body.position.y =
    height / 2;

  body.castShadow = true;

  body.receiveShadow = true;

  group.add(body);


  /*
     roof
  */

  const roof =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        width + .5,
        .3,
        depth + .5
      ),

      new THREE.MeshStandardMaterial({
        color: 0x333333
      })
    );

  roof.position.y =
    height + .15;

  group.add(roof);


  /*
     windows
  */

  for (
    let y = 2;
    y < height - 1;
    y += 2.7
  ) {

    for (
      let xx =
        -width / 2 + 1.2;

      xx <
        width / 2 - .5;

      xx += 2.5
    ) {

      const win =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            .9,
            1,
            .06
          ),

          new THREE.MeshStandardMaterial({
            color: 0x7cc7e8,
            emissive: 0x071521
          })
        );

      win.position.set(
        xx,
        y,
        depth / 2 + .04
      );

      group.add(win);
    }
  }


  group.position.set(
    x,
    0,
    z
  );

  scene.add(group);

  return group;
}

/* =====================================================
   JOYSTICK
===================================================== */

const joystick =
  document.getElementById(
    "joystick"
  );

const stick =
  document.getElementById(
    "stick"
  );

let joyX = 0;
let joyY = 0;

let active = false;

let pointerId = null;

const maxDistance = 36;


function moveStick(
  x,
  y
) {

  const r =
    joystick.getBoundingClientRect();

  const centerX =
    r.left +
    r.width / 2;

  const centerY =
    r.top +
    r.height / 2;

  let dx =
    x - centerX;

  let dy =
    y - centerY;

  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );

  if (
    distance >
    maxDistance
  ) {

    dx =
      dx / distance *
      maxDistance;

    dy =
      dy / distance *
      maxDistance;
  }

  joyX =
    dx / maxDistance;

  joyY =
    dy / maxDistance;

  stick.style.transform =
    `translate(${dx}px,${dy}px)`;
}


function resetStick() {

  active = false;

  pointerId = null;

  joyX = 0;
  joyY = 0;

  stick.style.transform =
    "translate(0px,0px)";
}


joystick.addEventListener(
  "pointerdown",
  e => {

    active = true;

    pointerId =
      e.pointerId;

    joystick.setPointerCapture(
      e.pointerId
    );

    moveStick(
      e.clientX,
      e.clientY
    );
  }
);


joystick.addEventListener(
  "pointermove",
  e => {

    if (
      !active ||
      e.pointerId !== pointerId
    ) return;

    moveStick(
      e.clientX,
      e.clientY
    );
  }
);


joystick.addEventListener(
  "pointerup",
  resetStick
);

joystick.addEventListener(
  "pointercancel",
  resetStick
);


/* =====================================================
   MOVEMENT
===================================================== */

let running = false;

let verticalVelocity = 0;

let grounded = true;

const gravity = -18;

const walkSpeed = 5;

const runSpeed = 9;

const turnSpeed = 2.7;


document
  .getElementById("run")
  .addEventListener(
    "pointerdown",
    () => {
      running = true;
    }
  );

document
  .getElementById("run")
  .addEventListener(
    "pointerup",
    () => {
      running = false;
    }
  );


document
  .getElementById("jump")
  .addEventListener(
    "pointerdown",
    () => {

      if (grounded) {

        verticalVelocity =
          7.5;

        grounded = false;
      }
    }
  );


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(delta) {

  const distance = 7;

  const height = 4.3;


  const x =
    player.position.x -
    Math.sin(
      player.rotation.y
    ) *
    distance;


  const z =
    player.position.z -
    Math.cos(
      player.rotation.y
    ) *
    distance;


  const desired =
    new THREE.Vector3(
      x,
      Math.max(
        1.8,
        player.position.y +
        height
      ),
      z
    );


  camera.position.lerp(
    desired,
    Math.min(
      1,
      delta * 6
    )
  );


  camera.position.y =
    Math.max(
      camera.position.y,
      1.8
    );


  camera.lookAt(
    player.position.x,
    player.position.y + 1.2,
    player.position.z
  );
}


/* =====================================================
   PLAYER UPDATE
===================================================== */

function updatePlayer(delta) {

  const forward =
    -joyY;

  const turn =
    joyX;


  /* turn */

  if (
    Math.abs(turn) >
    .05
  ) {

    player.rotation.y -=
      turn *
      turnSpeed *
      delta;
  }


  /* move */

  if (
    Math.abs(forward) >
    .05
  ) {

    const speed =
      running
        ? runSpeed
        : walkSpeed;


    player.position.x +=
      Math.sin(
        player.rotation.y
      ) *
      speed *
      forward *
      delta;


    player.position.z +=
      Math.cos(
        player.rotation.y
      ) *
      speed *
      forward *
      delta;
  }


  /* jump */

  verticalVelocity +=
    gravity *
    delta;

  player.position.y +=
    verticalVelocity *
    delta;


  if (
    player.position.y <= 0
  ) {

    player.position.y = 0;

    verticalVelocity = 0;

    grounded = true;
  }
}


/* =====================================================
   DAY/NIGHT
===================================================== */

let gameTime = 12;


function updateTime(delta) {

  gameTime +=
    delta * .03;

  if (
    gameTime >= 24
  ) {
    gameTime -= 24;
  }


  const hour =
    Math.floor(
      gameTime
    );

  const minute =
    Math.floor(
      (gameTime - hour) *
      60
    );


  document.getElementById(
    "clock"
  ).textContent =
    "🕐 " +
    String(hour)
      .padStart(2,"0") +
    ":" +
    String(minute)
      .padStart(2,"0");


  const angle =
    ((gameTime - 6) /
      24) *
    Math.PI * 2;


  const sy =
    Math.sin(angle) *
    100;


  sun.position.set(
    Math.cos(angle) * 100,
    Math.max(5, sy),
    40
  );


  const daylight =
    Math.max(
      .12,
      Math.sin(angle) *
      .5 + .5
    );


  sun.intensity =
    daylight * 2;


  ambient.intensity =
    .3 +
    daylight;


  if (
    gameTime >= 6 &&
    gameTime < 18
  ) {

    scene.background =
      new THREE.Color(
        0x79bce8
      );

  } else {

    scene.background =
      new THREE.Color(
        0x11182d
      );
  }
}


/* =====================================================
   ANIMATION
===================================================== */

const clock =
  new THREE.Clock();


function animate() {

  requestAnimationFrame(
    animate
  );


  const delta =
    Math.min(
      clock.getDelta(),
      .05
    );


  updatePlayer(delta);

  updateCamera(delta);

  updateTime(delta);


  renderer.render(
    scene,
    camera
  );
}


animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(

  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);
